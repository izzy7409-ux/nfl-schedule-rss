<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRP Lower Third Remote</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0810;--panel:rgba(20,17,30,.88);--panel2:rgba(12,10,19,.94);--stroke:rgba(190,160,255,.23);--purple:#9271d6;--purple2:#b88cff;--text:#fbfaff;--soft:rgba(255,255,255,.66);--danger:#b45468}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 0%,rgba(146,113,214,.20),transparent 28%),#09070e;color:var(--text);font-family:Inter,Arial,sans-serif;padding:22px}.shell{max-width:1320px;margin:auto}.header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}.header h1{margin:0;font-family:'Bebas Neue',Impact,sans-serif;font-size:38px;letter-spacing:.04em}.header p{margin:4px 0 0;color:var(--soft)}.statusPill{padding:9px 12px;border-radius:999px;border:1px solid var(--stroke);background:rgba(255,255,255,.04);color:var(--soft);font-size:12px}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px}.card{background:linear-gradient(180deg,var(--panel),var(--panel2));border:1px solid var(--stroke);border-radius:20px;padding:18px;box-shadow:0 14px 34px rgba(0,0,0,.24);backdrop-filter:blur(18px)}.card h2{font-size:16px;margin:0 0 14px}.toolbar{display:flex;flex-wrap:wrap;gap:9px}.btn{border:1px solid rgba(255,255,255,.08);border-radius:12px;background:linear-gradient(180deg,#9f7bea,#7454bd);color:white;font:700 13px Inter;padding:11px 14px;cursor:pointer}.btn.secondary{background:rgba(255,255,255,.065)}.btn.breaking{background:linear-gradient(180deg,#aa78ff,#7346ca)}.btn.danger{background:rgba(180,84,104,.24);border-color:rgba(213,108,130,.25)}.btn:active{transform:translateY(1px)}.field{margin-top:12px}.field label{display:block;color:var(--soft);font-size:12px;margin:0 0 6px}.field input,.field textarea{width:100%;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.035);color:white;border-radius:12px;padding:11px 12px;font:500 14px Inter;outline:none}.field input:focus,.field textarea:focus{border-color:rgba(184,140,255,.52);box-shadow:0 0 0 3px rgba(146,113,214,.08)}.field textarea{min-height:138px;resize:vertical}.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.current{padding:14px;border-radius:15px;background:rgba(146,113,214,.10);border:1px solid rgba(184,140,255,.22);margin-bottom:12px}.current .small{color:var(--soft);font-size:11px;text-transform:uppercase;letter-spacing:.12em}.current .big{font-family:'Bebas Neue',Impact,sans-serif;font-size:30px;line-height:1;margin-top:5px}.topicList{display:flex;flex-direction:column;gap:8px;margin-top:12px;max-height:560px;overflow:auto;padding-right:3px}.topic{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:7px;align-items:center;padding:10px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);cursor:pointer}.topic.active{background:rgba(146,113,214,.13);border-color:rgba(184,140,255,.34)}.topicName{font-size:13px;line-height:1.3}.mini{width:34px;height:34px;border:1px solid rgba(255,255,255,.08);border-radius:9px;background:rgba(255,255,255,.055);color:white;cursor:pointer}.preview{margin-top:16px;border:1px solid rgba(255,255,255,.08);border-radius:14px;overflow:hidden;background:#15121d}.preview iframe{width:100%;height:360px;border:0;display:block;background:transparent}.urlbox{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}.urlbox input{min-width:0}.note{font-size:12px;color:var(--soft);margin-top:10px}.ok{color:#c9b7ff}@media(max-width:980px){body{padding:14px}.grid{grid-template-columns:1fr}.header{flex-direction:column}.row2{grid-template-columns:1fr}.preview iframe{height:260px}}</style>
</head>
<body><div class="shell">
<div class="header"><div><h1>PRP LOWER THIRD REMOTE</h1><p>Build your weekly rundown, jump between topics live, or trigger Breaking News instantly.</p></div><div id="status" class="statusPill">Connecting…</div></div>
<div class="grid">
<section class="card">
  <h2>LIVE CONTROLS</h2>
  <div class="current"><div id="modeText" class="small">LIVE DISCUSSION</div><div id="currentTitle" class="big">—</div></div>
  <div class="toolbar"><button class="btn secondary" id="prev">← Previous</button><button class="btn" id="next">Next →</button><button class="btn secondary" id="visibility">Hide Lower Third</button><button class="btn secondary" id="discussion">Discussion Mode</button></div>
  <div class="field"><label>Quick Breaking News headline</label><input id="breakingHeadline" maxlength="150" placeholder="Example: RAVENS MAKE A TRADE"></div>
  <div class="toolbar" style="margin-top:9px"><button class="btn breaking" id="breaking">Activate Breaking News</button></div>
  <div class="row2">
    <div class="field"><label>Discussion chip label</label><input id="label" maxlength="40"></div>
    <div class="field"><label>Logo subtext</label><input id="logoText" maxlength="50"></div>
  </div>
  <div class="field"><label>Bottom ticker</label><textarea id="ticker"></textarea></div>
  <div class="toolbar" style="margin-top:9px"><button class="btn" id="saveSettings">Save Display Settings</button><button class="btn secondary" id="resetTicker">Reset Default Ticker</button></div>
  <div class="preview"><iframe src="/lower-third" title="Lower third preview"></iframe></div>
</section>
<section class="card">
  <h2>WEEKLY TOPICS</h2>
  <div class="field"><label>Replace the full weekly list — one topic per line</label><textarea id="bulk"></textarea></div>
  <div class="toolbar" style="margin-top:9px"><button class="btn" id="saveTopics">Save Weekly Topics</button></div>
  <div class="field"><label>Add one topic</label><input id="newTopic" maxlength="150" placeholder="Type a new discussion topic"></div>
  <div class="toolbar" style="margin-top:9px"><button class="btn secondary" id="addTopic">Add Topic</button></div>
  <div id="topicList" class="topicList"></div>
  <div class="note">Click a topic row to put it on-air immediately. Arrow buttons reorder the rundown.</div>
  <h2 style="margin-top:18px">QUICK LINKS</h2>
  <div class="field"><label>EVMux web source</label><div class="urlbox"><input id="sourceUrl" readonly><button class="btn secondary copy" data-target="sourceUrl">Copy</button></div></div>
  <div class="field"><label>Private remote</label><div class="urlbox"><input id="remoteUrl" readonly><button class="btn secondary copy" data-target="remoteUrl">Copy</button></div></div>
</section>
</div></div>
<script>
const $=id=>document.getElementById(id),key=new URLSearchParams(location.search).get('key')||'';let state=null;
function api(path,body){return fetch(path+(path.includes('?')?'&':'?')+'key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json())}
function setStatus(t){$('status').textContent=t;$('status').classList.add('ok')}
function render(){if(!state)return;$('modeText').textContent=state.mode==='breaking'?'BREAKING NEWS':'LIVE DISCUSSION';$('currentTitle').textContent=state.displayTitle||'—';$('visibility').textContent=state.visible?'Hide Lower Third':'Show Lower Third';$('label').value=state.label||'';$('logoText').value=state.logoText||'';$('ticker').value=state.ticker||'';$('bulk').value=(state.topics||[]).join('\n');if(state.mode==='breaking'&&state.breakingHeadline)$('breakingHeadline').value=state.breakingHeadline;const list=$('topicList');list.innerHTML='';(state.topics||[]).forEach((topic,index)=>{const row=document.createElement('div');row.className='topic'+(state.mode!=='breaking'&&index===state.currentIndex?' active':'');row.innerHTML='<div class="topicName"><strong>'+(index+1)+'.</strong> '+topic+'</div><button class="mini" data-a="up">↑</button><button class="mini" data-a="down">↓</button><button class="mini" data-a="del">×</button>';row.addEventListener('click',async e=>{const a=e.target?.dataset?.a;if(!a){await act('setCurrent',{index});return}e.stopPropagation();if(a==='up'&&index>0)await act('moveTopic',{from:index,to:index-1});if(a==='down'&&index<state.topics.length-1)await act('moveTopic',{from:index,to:index+1});if(a==='del')await act('removeTopic',{index})});list.appendChild(row)});}
async function act(action,extra={}){const d=await api('/api/lower-third-control',{action,...extra});if(d.ok){state=d.state;render();setStatus('Updated live')}else setStatus(d.error||'Action failed')}
async function load(){try{const r=await fetch('/api/lower-third-state?ts='+Date.now(),{cache:'no-store'}),d=await r.json();if(d.ok){state=d.state;render();setStatus('Live')}}catch{setStatus('Connection issue')}}
$('prev').onclick=()=>act('prev');$('next').onclick=()=>act('next');$('visibility').onclick=()=>act('toggleVisible');$('discussion').onclick=()=>act('discussion');$('breaking').onclick=()=>act('breaking',{headline:$('breakingHeadline').value});$('saveSettings').onclick=()=>act('saveSettings',{label:$('label').value,logoText:$('logoText').value,ticker:$('ticker').value});$('resetTicker').onclick=()=>act('resetTicker');$('saveTopics').onclick=()=>act('setTopics',{topics:$('bulk').value.split('\n').map(x=>x.trim()).filter(Boolean)});$('addTopic').onclick=async()=>{const topic=$('newTopic').value.trim();if(!topic)return;await act('addTopic',{topic});$('newTopic').value=''};
$('sourceUrl').value=location.origin+'/lower-third';$('remoteUrl').value=location.href;document.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{const i=$(b.dataset.target);await navigator.clipboard.writeText(i.value);setStatus('Copied')});
try{const es=new EventSource('/api/lower-third-stream');es.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.ok){state=d.state;render()}}catch{}}}catch{}load();
</script></body></html>
