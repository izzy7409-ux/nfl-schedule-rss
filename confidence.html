<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRP Confidence Meter</title><style>
:root{--glass1:rgba(18,16,28,.62);--glass2:rgba(10,8,16,.58);--stroke:rgba(255,255,255,.16);--muted:rgba(255,255,255,.70);--white:#faf9ff;--purple:#9271d6;--purple2:#b98cff;--track:rgba(255,255,255,.18)}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:transparent;color:var(--white);font-family:Inter,Montserrat,Arial,sans-serif;overflow:hidden}body{display:flex;justify-content:center;align-items:flex-start;padding:18px}.overlay{width:min(1180px,calc(100vw - 36px));background:linear-gradient(180deg,var(--glass1),var(--glass2));border:1px solid var(--stroke);border-radius:30px;backdrop-filter:blur(24px) saturate(130%);-webkit-backdrop-filter:blur(24px) saturate(130%);box-shadow:0 22px 58px rgba(0,0,0,.30);padding:22px 26px;position:relative;overflow:hidden}.overlay:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 18% 12%,rgba(146,113,214,.18),transparent 28%),radial-gradient(circle at 84% 80%,rgba(185,140,255,.15),transparent 26%);pointer-events:none}.top{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.brandline{display:flex;align-items:center;gap:12px;flex:1}.brandline b{font-size:12px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted);white-space:nowrap}.rule{height:1px;background:rgba(255,255,255,.18);flex:1}.tag{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);white-space:nowrap}.prp{display:flex;align-items:center;gap:8px}.prp img{width:44px;height:44px;object-fit:contain}.prp span{font-size:14px;font-weight:900;line-height:.96;text-transform:uppercase}.grid{position:relative;z-index:2;display:grid;grid-template-columns:1.1fr .9fr .88fr;gap:22px;align-items:center}.headline{font-size:72px;line-height:.92;letter-spacing:-.045em;font-weight:950;text-transform:uppercase;margin:0 0 18px}.headline em{display:block;font-style:normal;background:linear-gradient(180deg,#dabdff,#a86cff);color:transparent;-webkit-background-clip:text;background-clip:text}.matchup{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:14px 18px}.team{display:flex;align-items:center;gap:10px;min-width:0}.team.right{justify-content:flex-end;text-align:right}.team img{width:66px;height:66px;object-fit:contain}.team strong{font-size:22px;text-transform:uppercase;white-space:nowrap}.vs{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.12);font-weight:900}.gaugeWrap{display:grid;place-items:center}.gauge{width:330px;height:330px;position:relative}.gauge svg{width:100%;height:100%;filter:drop-shadow(0 0 16px rgba(146,113,214,.18))}.gauge .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding-top:6px}.pct{font-size:76px;font-weight:950;line-height:.9;letter-spacing:-.05em}.status{font-size:17px;letter-spacing:.26em;text-transform:uppercase;font-weight:800;margin-top:10px}.mini{width:46px;height:46px;object-fit:contain;margin:12px auto 0}.vote{border-left:1px solid rgba(255,255,255,.14);padding-left:22px}.vote .eyebrow{font-size:15px;letter-spacing:.22em;text-transform:uppercase;color:#cfc3ef;margin-bottom:7px}.vote .cta{font-size:42px;font-weight:950;line-height:1;text-transform:uppercase;white-space:nowrap;margin-bottom:16px}.vote .cta span{background:linear-gradient(180deg,#d0a8ff,#9d63ff);color:transparent;-webkit-background-clip:text;background-clip:text}.legend{background:rgba(255,255,255,.065);border:1px solid rgba(255,255,255,.13);border-radius:22px;padding:10px 16px}.row{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:center;padding:9px 0}.row+.row{border-top:1px solid rgba(255,255,255,.09)}.pill{height:38px;border-radius:11px;display:grid;place-items:center;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.09);font-size:16px;font-weight:900}.pill.on{background:linear-gradient(180deg,#c997ff,#9f60ff);box-shadow:0 0 16px rgba(159,96,255,.25)}.row span{font-size:18px}.closed{position:absolute;right:26px;bottom:18px;z-index:5;font-size:11px;letter-spacing:.18em;text-transform:uppercase;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.11);color:var(--muted)}.closed.open{color:#fff;background:rgba(146,113,214,.23)}@media(max-width:1080px){body{overflow:auto}.grid{grid-template-columns:1fr}.vote{border-left:0;border-top:1px solid rgba(255,255,255,.14);padding:18px 0 0}.gaugeWrap{justify-content:start}.overlay{width:100%}}
</style></head><body><div class="overlay"><div class="top"><div class="brandline"><b>Purple Reign Podcast</b><div class="rule"></div><div class="tag">Ravens Football. All Year Long.</div></div><div class="prp"><img src="/prp-logo.svg" alt="PRP"><span>Purple<br>Reign<br>Podcast</span></div></div><div class="grid"><section><h1 class="headline">How Confident<em>Are You?</em></h1><div class="matchup"><div class="team"><img src="https://a.espncdn.com/i/teamlogos/nfl/500/bal.png" alt="Ravens"><strong>Ravens</strong></div><div class="vs">vs</div><div class="team right"><strong id="oppName">Opponent</strong><img id="oppLogo" alt="Opponent"></div></div></section><section class="gaugeWrap"><div class="gauge"><svg viewBox="0 0 360 360" aria-hidden="true"><path id="track" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="28" stroke-linecap="round"/><path id="progress" fill="none" stroke="url(#grad)" stroke-width="28" stroke-linecap="round"/><line id="tick" x1="0" y1="0" x2="0" y2="0" stroke="#fff" stroke-width="10" stroke-linecap="round"/><defs><linearGradient id="grad" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c79aff"/><stop offset="1" stop-color="#8f5cff"/></linearGradient></defs></svg><div class="center"><div id="pct" class="pct">--%</div><div id="status" class="status">Waiting</div><img class="mini" src="/prp-logo.svg" alt=""></div></div></section><section class="vote"><div class="eyebrow">Vote in YouTube Chat</div><div class="cta">Type <span>!1 !2 !3 !4 !5</span></div><div class="legend"><div class="row"><div id="p1" class="pill">!1</div><span>No confidence</span></div><div class="row"><div id="p2" class="pill">!2</div><span>Nervous</span></div><div class="row"><div id="p3" class="pill">!3</div><span>Toss-up</span></div><div class="row"><div id="p4" class="pill">!4</div><span>Confident</span></div><div class="row"><div id="p5" class="pill">!5</div><span>Very confident</span></div></div></section></div><div id="openState" class="closed">Voting closed</div></div><script>
const $=id=>document.getElementById(id);function pt(cx,cy,r,a){const rad=(a-90)*Math.PI/180;return{x:cx+r*Math.cos(rad),y:cy+r*Math.sin(rad)}}function arc(cx,cy,r,a0,a1){const s=pt(cx,cy,r,a1),e=pt(cx,cy,r,a0),large=(a1-a0)<=180?0:1;return`M ${s.x} ${s.y} A ${r} ${r} 0 ${large} 0 ${e.x} ${e.y}`}const START=-140,END=140,R=140,C=180;$('track').setAttribute('d',arc(C,C,R,START,END));function label(p){if(p==null)return'Waiting';if(p<20)return'No Confidence';if(p<40)return'Nervous';if(p<60)return'Toss-up';if(p<80)return'Confident';return'Very Confident'}function render(s){const v=s.votes||{},pct=v.percent,fill=pct==null?0:Math.max(0,Math.min(100,pct)),ang=START+(END-START)*(fill/100);$('progress').setAttribute('d',arc(C,C,R,START,ang));const inner=pt(C,C,R-22,ang),outer=pt(C,C,R+22,ang);$('tick').setAttribute('x1',inner.x);$('tick').setAttribute('y1',inner.y);$('tick').setAttribute('x2',outer.x);$('tick').setAttribute('y2',outer.y);$('pct').textContent=pct==null?'--%':pct+'%';$('status').textContent=label(pct);const m=s.matchup||{};$('oppName').textContent=m.opponent?.name||m.opponent?.abbr||'Opponent';$('oppLogo').src=m.opponent?.logo||'';for(let i=1;i<=5;i++)$('p'+i).classList.toggle('on',v.topBucket===i);$('openState').textContent=s.votingOpen?'Voting open':'Voting closed';$('openState').classList.toggle('open',!!s.votingOpen)}async function load(){try{const r=await fetch('/api/confidence-state?ts='+Date.now(),{cache:'no-store'});render(await r.json())}catch{}}load();setInterval(load,5000);try{const es=new EventSource('/api/confidence-stream');es.onmessage=e=>{try{render(JSON.parse(e.data))}catch{}}}catch{}
</script></body></html>
