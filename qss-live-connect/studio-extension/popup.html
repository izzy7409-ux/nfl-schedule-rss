<!doctype html><html><head><meta charset="utf-8"><title>QSS Studio Sync</title><style>body{width:340px;padding:18px;margin:0;background:#110d19;color:#f8f5ff;font:14px Arial}h1{font-size:20px;margin:0 0 12px}p{line-height:1.5;color:#c5bad6}label{display:block;margin:14px 0 7px}input{box-sizing:border-box;width:100%;padding:11px;border-radius:9px;background:#21182f;border:1px solid #665177;color:white}button,a{display:inline-block;padding:10px;margin:10px 5px 0 0;border:0;border-radius:8px;background:#9271d6;color:white;text-decoration:none;cursor:pointer}.status{padding:12px;background:#21182f;border-radius:10px}small{display:block;margin-top:8px;color:#bdadc9}</style></head><body><h1>QSS Studio Subscriber Sync</h1><div class="status" id="status">Not connected</div><small id="last"></small><small id="reader"></small><p>In your QSS remote, generate a Studio connection code and paste it here.</p><label for="code">Studio connection code</label><input id="code" type="password" autocomplete="off"><button id="connect">Connect</button><button id="disconnect">Disconnect</button><button id="pick">Select subscriber count</button><a href="https://quiet-storm-sports-production.up.railway.app/lower-third-control#qss" target="_blank">Open QSS remote</a><p>Keep your YouTube Studio live subscriber-count page open. Your Mac must stay awake. Updates follow the count shown by Studio.</p><script src="popup.js"></script></body></html>
