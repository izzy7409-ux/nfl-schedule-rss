<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>QSS Streamlabs Connection</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b0c12;color:#f8f6ff;font-family:Arial,sans-serif}.card{max-width:520px;margin:24px;padding:32px;background:#181923;border:1px solid #36313f;border-radius:22px}h1{font-size:27px;margin:0 0 16px}p{color:#c1bacd;line-height:1.6}button{border:0;border-radius:10px;padding:12px 18px;background:#9271d6;color:white;font:700 15px Arial;cursor:pointer}</style></head><body><main class="card"><h1 id="heading">Streamlabs connection</h1><p id="message"></p><p>You can return to the QSS control center tab.</p><button id="close">Close this tab</button></main><script>const connected=new URLSearchParams(location.search).get('status')==='connected';document.getElementById('heading').textContent=connected?'Streamlabs is connected':'Streamlabs could not connect';document.getElementById('message').textContent=connected?'New YouTube subscribers, memberships, Super Chats, and tips can now update Recent Supporters while your automated overlay is open.':'Start again from your private QSS remote. Check that the application callback matches and that your Streamlabs account is on the application whitelist.';document.getElementById('close').onclick=()=>window.close();</script></body></html>
