<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRP Weekly Pick'em</title>
<style>
:root{--glass:rgba(18,18,22,.72);--glass2:rgba(8,8,11,.62);--stroke:rgba(255,255,255,.16);--stroke2:rgba(255,255,255,.08);--text:#fbfbfd;--muted:rgba(245,245,250,.66);--purple:#b69aff;--purple2:#9271d6;--gold:#efd68a;--shadow:0 24px 70px rgba(0,0,0,.40)}
*{box-sizing:border-box}html,body{width:100%;height:100%}body{margin:0;background:transparent;color:var(--text);font-family:Inter,Montserrat,Arial,sans-serif;overflow:hidden}.stage{width:100%;height:100%;display:flex;justify-content:center;align-items:flex-start;padding:18px}.board{width:min(1080px,calc(100vw - 36px));background:linear-gradient(180deg,var(--glass),var(--glass2));border:1px solid var(--stroke);border-radius:30px;box-shadow:var(--shadow);backdrop-filter:blur(26px) saturate(112%);-webkit-backdrop-filter:blur(26px) saturate(112%);overflow:hidden;position:relative}.board:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 16% 8%,rgba(146,113,214,.17),transparent 24%),radial-gradient(circle at 82% 84%,rgba(182,154,255,.11),transparent 26%);pointer-events:none}.top{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 20px;border-bottom:1px solid var(--stroke2)}.brand{display:flex;align-items:center;gap:12px}.logo{width:44px;height:44px;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.11);display:grid;place-items:center}.logo img{width:100%;height:100%;object-fit:cover}.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}.title{font-size:23px;font-weight:900;line-height:1.05}.progress{text-align:right}.week{font-size:13px;font-weight:900;letter-spacing:.15em;text-transform:uppercase;color:var(--purple)}.count{font-size:10px;color:var(--muted);margin-top:3px}.content{position:relative;z-index:1;padding:20px}.matchup{display:grid;grid-template-columns:1fr 120px 1fr;align-items:center;gap:18px;min-height:180px}.team{display:flex;align-items:center;gap:18px;min-width:0}.team.right{justify-content:flex-end;text-align:right}.teamLogo{width:118px;height:118px;border-radius:28px;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);display:grid;place-items:center;flex:0 0 auto;box-shadow:inset 0 1px 0 rgba(255,255,255,.07)}.teamLogo img{width:88%;height:88%;object-fit:contain;filter:drop-shadow(0 10px 18px rgba(0,0,0,.22))}.side{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}.abbr{font-size:42px;font-weight:950;line-height:.92;letter-spacing:-.04em}.name{font-size:14px;color:var(--muted);margin-top:7px;white-space:nowrap}.record{font-size:11px;color:var(--gold);margin-top:5px}.versus{text-align:center}.vs{width:70px;height:70px;margin:auto;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);font-size:18px;font-weight:900;color:var(--muted)}.kickMini{font-size:9px;color:var(--muted);margin-top:8px;white-space:nowrap}.liveScore{font-size:12px;font-weight:900;color:var(--gold);margin-top:6px;white-space:nowrap}.info{display:grid;grid-template-columns:1.1fr 1fr 1.45fr .9fr;gap:10px;margin-top:18px}.card{min-width:0;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.075);border-radius:20px;padding:13px 15px}.card label{display:block;font-size:8px;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}.card strong{display:block;font-size:18px;font-weight:900;line-height:1.08;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card span{display:block;font-size:9px;color:var(--muted);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.spread strong{color:var(--gold);font-size:22px}.weather strong{font-size:14px;white-space:normal;line-height:1.25}.weather .wx{color:var(--purple)}.footer{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:center;padding:11px 20px;border-top:1px solid var(--stroke2);font-size:9px;color:var(--muted)}.footer b{font-size:10px;letter-spacing:.13em;color:#fff;text-transform:uppercase}.fade{animation:swap .28s ease}@keyframes swap{from{opacity:.2;transform:translateY(6px)}to{opacity:1;transform:none}}@media(max-width:900px){.board{width:100%}.matchup{grid-template-columns:1fr 82px 1fr}.teamLogo{width:88px;height:88px}.abbr{font-size:32px}.info{grid-template-columns:1fr 1fr}.name{font-size:11px}}
</style></head>
<body><div class="stage"><main class="board"><header class="top"><div class="brand"><div class="logo"><img src="/prp-logo.svg" alt="PRP"></div><div><div class="eyebrow">Purple Reign Podcast</div><div class="title">Weekly Pick'em</div></div></div><div class="progress"><div id="week" class="week">Week --</div><div id="count" class="count">Game -- of --</div></div></header><div id="content" class="content"><section class="matchup"><div class="team"><div class="teamLogo"><img id="awayLogo"></div><div><div class="side">Away</div><div id="awayAbbr" class="abbr">---</div><div id="awayName" class="name">Away Team</div><div id="awayRecord" class="record"></div></div></div><div class="versus"><div class="vs">VS</div><div id="centerStatus" class="kickMini">UPCOMING</div><div id="liveScore" class="liveScore"></div></div><div class="team right"><div><div class="side">Home</div><div id="homeAbbr" class="abbr">---</div><div id="homeName" class="name">Home Team</div><div id="homeRecord" class="record"></div></div><div class="teamLogo"><img id="homeLogo"></div></div></section><section class="info"><div class="card"><label>Kickoff</label><strong id="kickoff">--</strong><span id="date">--</span></div><div class="card spread"><label>Point Spread</label><strong id="spread">Line pending</strong><span id="oddsSource"></span></div><div class="card weather"><label>Game Weather</label><strong id="weather" class="wx">Forecast pending</strong><span id="venue"></span></div><div class="card"><label>Watch</label><strong id="network">TBD</strong><span id="city"></span></div></section></div><footer class="footer"><span id="updated">Auto-updates weekly</span><b>PRP · Pick'em</b></footer></main></div>
<script>
const $=id=>document.getElementById(id);let lastId='';function fallback(abbr){return 'https://a.espncdn.com/i/teamlogos/nfl/500/'+String(abbr||'').toLowerCase()+'.png'}function img(el,url,abbr){el.src=url||fallback(abbr);el.onerror=()=>{el.onerror=null;el.src=fallback(abbr)}}function render(s){const g=s.game;if(!g)return;$('week').textContent=s.weekLabel||('Week '+s.week);$('count').textContent='Game '+(s.selectedIndex+1)+' of '+s.totalGames;if(lastId!==g.id){$('content').classList.remove('fade');void $('content').offsetWidth;$('content').classList.add('fade');lastId=g.id}img($('awayLogo'),g.away.logo,g.away.abbr);img($('homeLogo'),g.home.logo,g.home.abbr);$('awayAbbr').textContent=g.away.abbr;$('homeAbbr').textContent=g.home.abbr;$('awayName').textContent=g.away.fullName;$('homeName').textContent=g.home.fullName;$('awayRecord').textContent=g.away.record||'';$('homeRecord').textContent=g.home.record||'';$('kickoff').textContent=(g.kickoff?.day||'')+' '+(g.kickoff?.time||'')+' ET';$('date').textContent=g.kickoff?.date||'';$('spread').textContent=g.spread?.text||'Line pending';let small=[];if(g.spread?.provider)small.push(g.spread.provider);if(g.spread?.overUnder!=null)small.push('O/U '+g.spread.overUnder);$('oddsSource').textContent=small.join(' · ');$('weather').textContent=g.weather||'Forecast pending';$('venue').textContent=g.venue||'';$('network').textContent=g.network||'TBD';$('city').textContent=g.city||'';$('centerStatus').textContent=g.phase==='pre'?'UPCOMING':(g.statusText||g.phase.toUpperCase());$('liveScore').textContent=g.phase==='pre'?'':g.away.score+' - '+g.home.score;$('updated').textContent=s.lastError?s.lastError:'Auto-updates weekly · Data refreshed '+(s.updatedAt?new Date(s.updatedAt).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'')}
async function load(){try{const r=await fetch('/api/pickem-state?ts='+Date.now(),{cache:'no-store'});render(await r.json())}catch{}}load();setInterval(load,15000);try{const es=new EventSource('/api/pickem-stream');es.onmessage=e=>{try{render(JSON.parse(e.data))}catch{}}}catch{}
</script></body></html>
