<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRP Weekly Pick'em</title>
<style>
:root{--text:#fbfaff;--muted:#c1bbce;--purple:#bb9aff;--gold:#f0d38b;--stroke:rgba(255,255,255,.14)}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}body{background:transparent;color:var(--text);font-family:Inter,Montserrat,Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}.stage{position:absolute;inset:0;padding:12px;display:flex}.board{width:100%;height:100%;min-width:0;min-height:0;display:flex;flex-direction:column;position:relative;overflow:hidden;container-type:size;border:1px solid var(--stroke);border-radius:26px;background:linear-gradient(155deg,rgba(30,24,43,.97),rgba(12,11,18,.96));box-shadow:0 14px 40px rgba(0,0,0,.3)}.board:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 12% 0,rgba(146,113,214,.16),transparent 50%);pointer-events:none}.top,.content,.footer{position:relative;z-index:1}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:clamp(14px,1.8cqh,24px) clamp(18px,2cqw,32px);border-bottom:1px solid var(--stroke);flex:none}.brand{display:flex;align-items:center;gap:16px;min-width:0}.logo{width:clamp(42px,5cqw,66px);height:clamp(42px,5cqw,66px);flex:none;display:grid;place-items:center}.logo img{width:100%;height:100%;object-fit:contain}.eyebrow{font-size:clamp(12px,1.2cqw,18px);font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}.title{font-size:clamp(23px,3cqw,43px);font-weight:900;line-height:1.08;letter-spacing:-.025em}.content{flex:1;min-height:0;padding:clamp(14px,1.8cqh,24px) clamp(18px,2cqw,32px)}.footer{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:clamp(9px,1.2cqh,16px) clamp(18px,2cqw,32px);border-top:1px solid var(--stroke);font-size:clamp(12px,1.3cqw,19px);color:var(--muted);flex:none}.footer span{min-width:0;overflow-wrap:anywhere}.footer b{flex:none;font-size:clamp(12px,1.3cqw,19px);letter-spacing:.12em;color:#fff;text-transform:uppercase}body[data-layout="right"] .stage{inset:1.5vh 1.2vw 20vh 31vw;padding:0}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}

.progress{text-align:right;flex:none}.week{font-size:clamp(20px,2.3cqw,34px);font-weight:900;letter-spacing:.08em;color:var(--purple);text-transform:uppercase}.count{font-size:clamp(15px,1.6cqw,23px);color:var(--muted);margin-top:6px;font-variant-numeric:tabular-nums}.content{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:clamp(16px,2cqh,28px)}.matchup{display:grid;grid-template-columns:minmax(0,1fr) minmax(86px,.36fr) minmax(0,1fr);gap:clamp(12px,1.5cqw,24px);align-items:center;min-height:0;padding:clamp(8px,1.2cqh,18px) 0}.team{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:clamp(10px,1.2cqh,18px);min-width:0}.team>div:not(.teamLogo){width:100%;min-width:0}.team.right .teamLogo{order:-1}.teamLogo{width:clamp(100px,min(17cqw,20cqh),300px);height:clamp(100px,min(17cqw,20cqh),300px);flex:none;display:grid;place-items:center;border-radius:25%;border:1px solid rgba(255,255,255,.12);background:radial-gradient(ellipse at 50% 20%,rgba(255,255,255,.10),rgba(255,255,255,.025))}.teamLogo img{width:91%;height:91%;object-fit:contain;filter:drop-shadow(0 10px 16px rgba(0,0,0,.35))}.side{font-size:clamp(14px,1.4cqw,21px);font-weight:700;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:7px}.abbr{font-size:clamp(44px,min(5.8cqw,7.8cqh),105px);line-height:.95;font-weight:950;letter-spacing:-.04em}.name{font-size:clamp(19px,2.3cqw,34px);font-weight:700;line-height:1.15;margin:10px auto 0;max-width:100%;text-wrap:balance;overflow-wrap:normal}.record{font-size:clamp(18px,2cqw,28px);font-weight:750;color:var(--gold);margin-top:9px}.versus{text-align:center;min-width:0}.vs{width:clamp(62px,7cqw,110px);height:clamp(62px,7cqw,110px);margin:auto;display:grid;place-items:center;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.045);font-size:clamp(23px,3cqw,44px);font-weight:900;color:var(--muted)}.kickMini{font-size:clamp(13px,1.3cqw,19px);font-weight:700;color:var(--muted);line-height:1.4;margin-top:14px;overflow-wrap:anywhere}.liveScore{font-size:clamp(24px,3cqw,44px);font-weight:900;color:var(--gold);margin-top:10px;font-variant-numeric:tabular-nums}.info{display:grid;grid-template-columns:1fr 1fr;gap:clamp(10px,1.5cqh,20px)}.card{min-width:0;padding:clamp(12px,1.6cqh,20px) clamp(16px,2cqw,30px);border-radius:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10)}.card label{display:block;font-size:clamp(13px,1.25cqw,19px);font-weight:750;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin-bottom:7px}.card strong{display:block;font-size:clamp(22px,2.5cqw,38px);font-weight:850;line-height:1.13;overflow-wrap:anywhere}.card span{display:block;font-size:clamp(15px,1.55cqw,22px);color:var(--muted);line-height:1.25;margin-top:8px;overflow-wrap:anywhere}.spread strong{color:var(--gold);font-size:clamp(27px,3cqw,46px)}.weather strong{font-size:clamp(20px,2.3cqw,34px);color:var(--purple)}.fade{animation:swap .25s ease}@keyframes swap{from{opacity:.3;transform:translateY(5px)}to{opacity:1;transform:none}}
@container (max-height:570px) and (min-width:900px){.team{flex-direction:row;text-align:left;gap:18px}.team.right{flex-direction:row-reverse;text-align:right}.team.right .teamLogo{order:0}.teamLogo{width:clamp(90px,12cqw,180px);height:clamp(90px,12cqw,180px)}.abbr{font-size:clamp(40px,5cqw,72px)}.name{font-size:clamp(17px,1.9cqw,27px)}.info{grid-template-columns:1fr 1fr 1.2fr .8fr}.card{padding:15px}.card strong{font-size:clamp(19px,2cqw,29px)}.spread strong{font-size:clamp(23px,2.6cqw,36px)}.weather strong{font-size:clamp(17px,1.8cqw,25px)}.card span{font-size:clamp(13px,1.3cqw,18px)}}
@container (max-width:680px){.top{gap:10px}.eyebrow{font-size:10px;letter-spacing:.08em}.title{font-size:23px}.logo{width:38px;height:38px}.brand{gap:9px}.week{font-size:19px}.count{font-size:12px}.matchup{grid-template-columns:minmax(0,1fr) 62px minmax(0,1fr);gap:10px}.teamLogo{width:clamp(84px,24cqw,130px);height:clamp(84px,24cqw,130px)}.abbr{font-size:40px}.name{font-size:17px}.record{font-size:16px}.side{font-size:12px}.vs{width:52px;height:52px;font-size:19px}.kickMini{font-size:10px}.card{padding:12px}.card label{font-size:11px}.card strong{font-size:20px}.card span{font-size:13px}.spread strong{font-size:24px}.weather strong{font-size:17px}.footer{font-size:11px}.footer b{font-size:11px}}
@container (max-height:650px) and (min-width:681px){.top{padding:8px 18px;gap:12px}.logo{width:42px;height:42px}.eyebrow{font-size:11px}.title{font-size:26px}.footer{padding:5px 18px;font-size:12px}.footer b{font-size:12px}.content{padding:10px 18px;gap:10px}}@container (max-height:650px) and (min-width:681px){.week{font-size:22px}.count{font-size:14px}.matchup{padding:0;gap:12px}.team{gap:8px}.teamLogo{width:100px;height:100px}.side{font-size:11px;margin-bottom:4px}.abbr{font-size:48px}.name{font-size:21px;margin-top:6px}.record{font-size:17px;margin-top:5px}.vs{width:58px;height:58px;font-size:23px}.kickMini{font-size:12px}.info{gap:10px}.card{padding:10px 14px}.card label{font-size:12px;margin-bottom:5px}.card strong{font-size:24px}.card span{font-size:14px;margin-top:5px}.spread strong{font-size:29px}.weather strong{font-size:22px}}</style></head>
<body><script>document.body.dataset.layout=new URLSearchParams(location.search).get('layout')==='right'?'right':'panel';</script><div class="stage"><main class="board"><header class="top"><div class="brand"><div class="logo"><img src="/prp-logo.svg" alt="PRP"></div><div><div class="eyebrow">Purple Reign Podcast</div><div class="title">Weekly Pick'em</div></div></div><div class="progress"><div id="week" class="week">Week --</div><div id="count" class="count">Game -- of --</div></div></header><div id="content" class="content"><section class="matchup"><div class="team"><div class="teamLogo"><img id="awayLogo"></div><div><div class="side">Away</div><div id="awayAbbr" class="abbr">---</div><div id="awayName" class="name">Away Team</div><div id="awayRecord" class="record"></div></div></div><div class="versus"><div class="vs">VS</div><div id="centerStatus" class="kickMini">UPCOMING</div><div id="liveScore" class="liveScore"></div></div><div class="team right"><div><div class="side">Home</div><div id="homeAbbr" class="abbr">---</div><div id="homeName" class="name">Home Team</div><div id="homeRecord" class="record"></div></div><div class="teamLogo"><img id="homeLogo"></div></div></section><section class="info"><div class="card"><label>Kickoff</label><strong id="kickoff">--</strong><span id="date">--</span></div><div class="card spread"><label>Point Spread</label><strong id="spread">Line pending</strong><span id="oddsSource"></span></div><div class="card weather"><label>Game Weather</label><strong id="weather" class="wx">Forecast pending</strong><span id="venue"></span></div><div class="card"><label>Watch</label><strong id="network">TBD</strong><span id="city"></span></div></section></div><footer class="footer"><span id="updated">Auto-updates weekly</span><b>PRP · Pick'em</b></footer></main></div>
<script>
const $=id=>document.getElementById(id);let lastId='';function fallback(abbr){return 'https://a.espncdn.com/i/teamlogos/nfl/500/'+String(abbr||'').toLowerCase()+'.png'}function img(el,url,abbr){el.src=url||fallback(abbr);el.onerror=()=>{el.onerror=null;el.src=fallback(abbr)}}function render(s){const g=s.game;if(!g)return;$('week').textContent=s.weekLabel||('Week '+s.week);$('count').textContent='Game '+(s.selectedIndex+1)+' of '+s.totalGames;if(lastId!==g.id){$('content').classList.remove('fade');void $('content').offsetWidth;$('content').classList.add('fade');lastId=g.id}img($('awayLogo'),g.away.logo,g.away.abbr);img($('homeLogo'),g.home.logo,g.home.abbr);$('awayLogo').alt=g.away.fullName||g.away.abbr;$('homeLogo').alt=g.home.fullName||g.home.abbr;$('awayAbbr').textContent=g.away.abbr;$('homeAbbr').textContent=g.home.abbr;$('awayName').textContent=g.away.fullName;$('homeName').textContent=g.home.fullName;$('awayRecord').textContent=g.away.record||'';$('homeRecord').textContent=g.home.record||'';$('kickoff').textContent=(g.kickoff?.day||'')+' '+(g.kickoff?.time||'')+' ET';$('date').textContent=g.kickoff?.date||'';$('spread').textContent=g.spread?.text||'Line pending';let small=[];if(g.spread?.provider)small.push(g.spread.provider);if(g.spread?.overUnder!=null)small.push('O/U '+g.spread.overUnder);$('oddsSource').textContent=small.join(' · ');$('weather').textContent=g.weather||'Forecast pending';$('venue').textContent=g.venue||'';$('network').textContent=g.network||'TBD';$('city').textContent=g.city||'';$('centerStatus').textContent=g.phase==='pre'?'UPCOMING':(g.statusText||g.phase.toUpperCase());$('liveScore').textContent=g.phase==='pre'?'':g.away.score+' - '+g.home.score;$('updated').textContent=s.lastError?s.lastError:'Auto-updates weekly · Data refreshed '+(s.updatedAt?new Date(s.updatedAt).toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}):'')}
async function load(){try{const r=await fetch('/api/pickem-state?ts='+Date.now(),{cache:'no-store'});render(await r.json())}catch{}}load();setInterval(load,15000);try{const es=new EventSource('/api/pickem-stream');es.onmessage=e=>{try{render(JSON.parse(e.data))}catch{}}}catch{}
</script></body></html>
