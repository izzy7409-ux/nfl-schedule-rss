<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FitJess4U Inquiries</title><style>
:root{--bg:#f3f7f7;--ink:#3c3942;--muted:#7b7580;--teal:#75cbc4;--lav:#b49ae0;--pink:#efbccb;--glass:rgba(255,255,255,.68)}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:linear-gradient(135deg,#f7f1f4,#eef8f6 50%,#f5f0f9);color:var(--ink);min-height:100vh}.shell{max-width:1250px;margin:auto;padding:24px 18px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:18px}.top img{width:135px}.glass{background:var(--glass);border:1px solid rgba(255,255,255,.82);backdrop-filter:blur(26px) saturate(140%);border-radius:24px;box-shadow:0 18px 50px rgba(79,69,89,.12)}.login{max-width:470px;margin:10vh auto;padding:28px}.login h1{margin:8px 0}.input,select,textarea{width:100%;border:1px solid rgba(95,83,105,.12);background:rgba(255,255,255,.72);border-radius:14px;padding:12px 13px;font:inherit;color:var(--ink);outline:none}.btn{border:0;border-radius:14px;padding:11px 14px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--teal),var(--lav));color:white}.btn.ghost{background:rgba(255,255,255,.65);color:var(--ink);border:1px solid rgba(255,255,255,.85)}.toolbar{padding:15px;display:grid;grid-template-columns:1fr 180px auto auto;gap:10px;margin-bottom:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{padding:15px}.stat b{font-size:26px}.stat span{display:block;color:var(--muted);font-size:12px}.list{display:grid;gap:9px}.item{padding:14px 16px;display:grid;grid-template-columns:1fr 180px 150px auto;gap:14px;align-items:center;cursor:pointer}.item:hover{transform:translateY(-1px)}.name{font-weight:800}.meta{font-size:12px;color:var(--muted);margin-top:4px}.badge{display:inline-block;padding:6px 9px;border-radius:999px;background:rgba(117,203,196,.18);font-size:11px;font-weight:800}.drawer{position:fixed;inset:0;display:none;background:rgba(42,37,46,.24);padding:20px;z-index:5}.drawer.on{display:flex;justify-content:flex-end}.panel{width:min(720px,100%);height:100%;overflow:auto;padding:20px}.section{padding:15px 0;border-bottom:1px solid rgba(100,90,110,.10)}.section h3{font-size:13px;text-transform:uppercase;letter-spacing:.12em;color:#6f9f9a}.kv{display:grid;grid-template-columns:180px 1fr;gap:8px;font-size:14px}.kv div:nth-child(odd){color:var(--muted)}.actions{display:grid;grid-template-columns:180px 1fr;gap:10px;margin-top:12px}.empty{text-align:center;padding:45px;color:var(--muted)}@media(max-width:800px){.toolbar{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.item{grid-template-columns:1fr auto}.item>:nth-child(2),.item>:nth-child(3){display:none}.kv{grid-template-columns:1fr}.actions{grid-template-columns:1fr}}</style></head><body><div id="login" class="login glass"><img src="/logo.png" width="150"><h1>Inquiry Dashboard</h1><p>Private access for FitJess4U.</p><input id="pw" class="input" type="password" placeholder="Admin password"><button id="loginBtn" class="btn" style="margin-top:10px;width:100%">Sign in</button><div id="loginErr" class="meta"></div></div><main id="app" class="shell" hidden><div class="top"><img src="/logo.png"><div><button id="export" class="btn ghost">Export CSV</button> <button id="logout" class="btn ghost">Log out</button></div></div><div class="toolbar glass"><input id="search" class="input" placeholder="Search name, email, phone…"><select id="status"><option value="">All statuses</option><option>new</option><option>contacted</option><option>consultation-booked</option><option>client</option><option>closed</option></select><button id="refresh" class="btn ghost">Refresh</button><a href="/" target="_blank" class="btn" style="text-decoration:none;text-align:center">Open form</a></div><div id="stats" class="stats"></div><div id="list" class="list"></div></main><div id="drawer" class="drawer"><div class="panel glass"><button id="close" class="btn ghost">Close</button><div id="detail"></div></div></div><script>
const $=id=>document.getElementById(id);let records=[],current=null;async function api(url,opt){const r=await fetch(url,opt);if(r.status===401){$('app').hidden=true;$('login').style.display='block';throw new Error('Unauthorized')}return r}async function init(){try{const r=await fetch('/api/admin/me');if(!r.ok)throw 0;$('login').style.display='none';$('app').hidden=false;load()}catch{}}$('loginBtn').onclick=async()=>{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:$('pw').value})});const d=await r.json();if(!r.ok){$('loginErr').textContent=d.error||'Login failed';return}$('login').style.display='none';$('app').hidden=false;load()};$('logout').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST'});location.reload()};$('refresh').onclick=load;$('export').onclick=()=>location.href='/api/admin/export.csv';$('search').oninput=render;$('status').onchange=render;$('close').onclick=()=>$('drawer').classList.remove('on');
async function load(){const r=await api('/api/admin/inquiries');const d=await r.json();records=d.records||[];render()}function render(){const q=$('search').value.toLowerCase(),st=$('status').value;const filtered=records.filter(x=>(!st||x.status===st)&&(!q||[x.name,x.email,x.phone,(x.goals||[]).join(' ')].join(' ').toLowerCase().includes(q)));const counts={new:0,contacted:0,booked:0,total:records.length};records.forEach(x=>{if(x.status==='new')counts.new++;if(x.status==='contacted')counts.contacted++;if(x.status==='consultation-booked')counts.booked++});$('stats').innerHTML=[['Total',counts.total],['New',counts.new],['Contacted',counts.contacted],['Consultations',counts.booked]].map(([a,b])=>`<div class="stat glass"><b>${b}</b><span>${a}</span></div>`).join('');$('list').innerHTML=filtered.length?filtered.map(x=>`<div class="item glass" data-id="${x.id}"><div><div class="name">${esc(x.name)}</div><div class="meta">${esc(x.email)} • ${esc(x.phone)}</div></div><div>${new Date(x.createdAt).toLocaleDateString()}<div class="meta">${esc(x.consultationDate||'No date')} ${esc(x.consultationTime||'')}</div></div><div>${esc((x.goals||[]).slice(0,2).join(', '))}</div><div class="badge">${esc(x.status)}</div></div>`).join(''):'<div class="empty glass">No inquiries match this view.</div>';document.querySelectorAll('.item').forEach(n=>n.onclick=()=>open(n.dataset.id))}
async function open(id){const r=await api('/api/admin/inquiries/'+id),d=await r.json();current=d.record;$('drawer').classList.add('on');const groups=[['Contact',['name','age','email','phone','preferredContact','height','weight','goalWeight','referral']],['Training',['services','trainingFormat','goals','goalsOther','motivation','barriers','weeklyFrequency','availability','currentActivity','trainingExperience','equipment','startTimeline']],['Nutrition',['currentDiet','mealPrepInterest','dietaryRestrictions','foodDislikes','mealPrepDetails']],['Health',['healthConditions','injuriesLimitations','surgeries','medications','physicianRestrictions','pregnantPostpartum','painSymptoms']],['Lifestyle',['aboutMe','occupationSchedule','sleepStress','kidsCaregiving']],['Consultation',['consultationType','consultationDate','consultationTime','consultationAlt','timezone','additionalNotes']]];$('detail').innerHTML=`<h1>${esc(current.name)}</h1><div class="meta">Submitted ${new Date(current.createdAt).toLocaleString()}</div>`+groups.map(([name,keys])=>`<div class="section"><h3>${name}</h3><div class="kv">${keys.map(k=>`<div>${label(k)}</div><div>${esc(Array.isArray(current[k])?current[k].join(', '):(current[k]||'—'))}</div>`).join('')}</div></div>`).join('')+`<div class="section"><h3>Lead management</h3><div class="actions"><select id="editStatus"><option>new</option><option>contacted</option><option>consultation-booked</option><option>client</option><option>closed</option></select><textarea id="notes" class="input" placeholder="Private notes"></textarea></div><button id="save" class="btn" style="margin-top:10px">Save changes</button></div>`;$('editStatus').value=current.status;$('notes').value=current.adminNotes||'';$('save').onclick=save}
async function save(){const r=await api('/api/admin/inquiries/'+current.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:$('editStatus').value,adminNotes:$('notes').value})});if(r.ok){$('drawer').classList.remove('on');load()}}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function label(k){return k.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase())}init();
</script></body></html>
