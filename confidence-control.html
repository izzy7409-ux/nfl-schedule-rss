<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRP Confidence Control</title><style>body{margin:0;background:#0c0a12;color:#fff;font-family:Inter,Arial,sans-serif;padding:24px}.wrap{max-width:820px;margin:auto}.card{background:#17131f;border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:18px;margin-bottom:14px}h1{margin:0 0 6px}.muted{color:#aaa0ba}label{display:block;font-size:12px;color:#bdb2ca;margin:12px 0 6px}input{width:100%;background:#0f0c15;border:1px solid rgba(255,255,255,.12);color:#fff;border-radius:12px;padding:12px;font-size:15px}button{border:0;border-radius:12px;padding:11px 14px;font-weight:800;margin:6px 6px 0 0;cursor:pointer;background:#9271d6;color:#fff}.secondary{background:#2a2434}.danger{background:#7c2d3d}.good{background:#2f7a4b}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#100d16;border-radius:12px;padding:12px}.stat b{display:block;margin-top:4px}.votes{display:flex;gap:8px;flex-wrap:wrap}.votes button{min-width:58px}.status{white-space:pre-wrap;font-family:ui-monospace,monospace;font-size:12px;background:#0d0b12;padding:12px;border-radius:12px}.link{color:#c8acff}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><h1>PRP Confidence Meter Control</h1><div class="muted">Connect your live YouTube chat, open/close voting, reset votes, and test the meter.</div></div><div class="card"><label>YouTube Data API key</label><input id="apiKey" type="password" placeholder="Paste API key"><button onclick="act('setApiKey',{apiKey:apiKey.value})">Save key for this running service</button><label>YouTube livestream URL or video ID</label><input id="video" placeholder="https://youtube.com/watch?v=..."><button class="good" onclick="act('connect',{video:video.value})">Connect live chat</button><button class="secondary" onclick="act('disconnect')">Disconnect</button></div><div class="card"><button class="good" onclick="act('open')">Open voting</button><button class="secondary" onclick="act('close')">Close voting</button><button class="danger" onclick="act('reset')">Reset votes</button><button class="secondary" onclick="act('refreshMatchup')">Refresh matchup</button></div><div class="card"><div class="muted">Test the visual without YouTube chat</div><div class="votes"><button onclick="demo(1)">!1</button><button onclick="demo(2)">!2</button><button onclick="demo(3)">!3</button><button onclick="demo(4)">!4</button><button onclick="demo(5)">!5</button></div></div><div class="card grid"><div class="stat">Matchup<b id="matchup">--</b></div><div class="stat">Confidence<b id="confidence">--</b></div><div class="stat">YouTube<b id="youtube">--</b></div><div class="stat">Voting<b id="voting">--</b></div></div><div class="card"><div class="muted">Public EVMux source</div><div class="link">/confidence</div><pre id="status" class="status">Loading...</pre></div></div><script>const key=new URLSearchParams(location.search).get('key')||'';const $=id=>document.getElementById(id);async function state(){const r=await fetch('/api/confidence-state?ts='+Date.now(),{cache:'no-store'});const s=await r.json();render(s)}function render(s){$('matchup').textContent='Ravens vs '+(s.matchup?.opponent?.name||'--');$('confidence').textContent=s.votes?.percent==null?'No votes':s.votes.percent+'% ('+s.votes.total+' voters)';$('youtube').textContent=s.connected?(s.videoTitle||s.videoId||'Connected'):(s.apiKeyConfigured?'API key ready':'API key needed');$('voting').textContent=s.votingOpen?'OPEN':'CLOSED';$('status').textContent=JSON.stringify({connected:s.connected,votingOpen:s.votingOpen,videoTitle:s.videoTitle,votes:s.votes,lastError:s.lastError,matchup:s.matchup},null,2)}async function act(action,extra={}){const r=await fetch('/api/confidence-control?key='+encodeURIComponent(key),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,...extra})});const d=await r.json();if(!r.ok)alert(d.error||'Action failed');render(d.state||d)}function demo(bucket){act('demoVote',{bucket})}state();setInterval(state,3000)</script></body></html>
